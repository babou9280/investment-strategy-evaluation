name: Breaktest validation

on:
  pull_request:
    branches:
      - breaktest-bootstrap
  push:
    branches:
      - breaktest-bootstrap
      - 'codex/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
          /usr/bin/chromium --version

      - name: Deterministic build
        run: python3 scripts/build_breaktest.py

      - name: Temporary C1 context inspection
        if: ${{ hashFiles('scripts/inspect_c1_context.py') != '' }}
        run: python3 scripts/inspect_c1_context.py

      - name: Strict numeric validation H1
        run: node tests/h1_strict_numeric_validation.test.js

      - name: Browser regression suites
        run: |
          python3 tests/h1_browser_smoke.py
          python3 tests/c2_temporal_isolation.py
          python3 tests/c3_chronological_turnover.py
          if [ -f tests/c1_capital_reservation.py ]; then
            python3 tests/c1_capital_reservation.py
          fi

      - name: JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('app/Breaktest_Studio.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No JavaScript block found in Breaktest_Studio.html')
          Path('/tmp/breaktest-built.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/breaktest-built.js
