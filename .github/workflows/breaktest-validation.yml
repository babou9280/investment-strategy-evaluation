name: Breaktest validation

on:
  pull_request:
    branches:
      - breaktest-bootstrap
  push:
    branches:
      - breaktest-bootstrap
      - 'codex/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
          /usr/bin/chromium --version

      - name: Deterministic build
        run: |
          set -o pipefail
          python3 scripts/build_breaktest.py 2>&1 | tee build.log

      - name: Upload built HTML for H2 review
        uses: actions/upload-artifact@v4
        with:
          name: breaktest-built-html-h2
          path: app/Breaktest_Studio.html
          if-no-files-found: error
          retention-days: 1

      - name: Numeric and result-basis validation
        run: |
          set -o pipefail
          {
            node tests/h1_strict_numeric_validation.test.js
            node tests/h2_journal_net_bases.test.js
          } 2>&1 | tee numeric-tests.log

      - name: Browser regression suites
        run: |
          set -o pipefail
          {
            python3 tests/h1_browser_smoke.py
            python3 tests/c2_temporal_isolation.py
            python3 tests/c3_chronological_turnover.py
            if [ -f tests/c1_capital_reservation.py ]; then
              python3 tests/c1_capital_reservation.py
            fi
            if [ -f tests/c4_realized_equity_curve.py ]; then
              python3 tests/c4_realized_equity_curve.py
            fi
            if [ -f tests/c4_negative_free_cash.py ]; then
              python3 tests/c4_negative_free_cash.py
            fi
            if [ -f tests/h2_journal_net_bases.py ]; then
              python3 tests/h2_journal_net_bases.py
            fi
          } 2>&1 | tee browser-tests.log

      - name: JavaScript syntax
        run: |
          set -o pipefail
          {
            python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('app/Breaktest_Studio.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No JavaScript block found in Breaktest_Studio.html')
          Path('/tmp/breaktest-built.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
            node --check /tmp/breaktest-built.js
          } 2>&1 | tee javascript-syntax.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breaktest-validation-logs
          path: |
            build.log
            numeric-tests.log
            browser-tests.log
            javascript-syntax.log
          if-no-files-found: warn
          retention-days: 3
