name: Breaktest validation

on:
  pull_request:
    branches:
      - breaktest-bootstrap
  push:
    branches:
      - breaktest-bootstrap
      - 'codex/**'
      - 'strategy/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
          /usr/bin/chromium --version

      - name: Deterministic build
        env:
          BREAKTEST_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          {
            python3 scripts/build_breaktest.py
            python3 cost_gate_critique/build.py \
              --source-commit "$BREAKTEST_SOURCE_COMMIT" \
              --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --browser-under-test "$(/usr/bin/chromium --version)"
          } 2>&1 | tee build.log

      - name: Numeric and result-basis validation
        run: |
          set -o pipefail
          {
            node tests/h1_strict_numeric_validation.test.js
            node tests/h2_journal_net_bases.test.js
            node tests/validation_calculator.test.js
            node capital_efficiency_lab/tests/engine.test.js
            node capital_efficiency_lab/tests/scenario_matrix.test.js
            node capital_efficiency_lab/tests/edge_range.test.js
            node capital_efficiency_lab/tests/point_range_consistency.test.js
            node capital_efficiency_lab/tests/optional_annual_inputs.test.js
            node cost_gate_foundation/tests/engine.test.js
            node cost_gate_foundation/tests/scenario_matrix.test.js
            node cost_gate_foundation/tests/properties.test.js
            node cost_gate_critique/tests/crypto_shim.test.js
            node cost_gate_critique/tests/scenario.test.js
            node cost_gate_critique/tests/presenter.test.js
          } 2>&1 | tee numeric-tests.log

      - name: Static privacy and integrity
        run: |
          set -o pipefail
          {
            python3 tests/validation_static_integrity.py
            python3 capital_efficiency_lab/tests/static_integrity.py
            python3 cost_gate_foundation/tests/static_integrity.py
            python3 cost_gate_critique/tests/static_integrity.py
            python3 cost_gate_critique/tests/package_integrity.py
          } 2>&1 | tee static-integrity.log

      - name: Browser regression suites
        run: |
          set -o pipefail
          {
            python3 tests/h1_browser_smoke.py
            python3 tests/c2_temporal_isolation.py
            python3 tests/c3_chronological_turnover.py
            if [ -f tests/c1_capital_reservation.py ]; then
              python3 tests/c1_capital_reservation.py
            fi
            if [ -f tests/c4_realized_equity_curve.py ]; then
              python3 tests/c4_realized_equity_curve.py
            fi
            if [ -f tests/c4_negative_free_cash.py ]; then
              python3 tests/c4_negative_free_cash.py
            fi
            if [ -f tests/h2_journal_net_bases.py ]; then
              python3 tests/h2_journal_net_bases.py
            fi
            python3 tests/validation_browser.py
            python3 capital_efficiency_lab/tests/browser.py
            python3 cost_gate_critique/tests/browser.py
          } 2>&1 | tee browser-tests.log

      - name: Capture internal review screens
        run: |
          set -o pipefail
          {
            python3 capital_efficiency_lab/tests/capture_review.py
            python3 cost_gate_critique/tests/capture_review.py
          } 2>&1 | tee review-capture.log

      - name: Syntax validation
        run: |
          set -o pipefail
          {
            python3 -m py_compile \
              tests/validation_browser.py \
              tests/validation_static_integrity.py \
              capital_efficiency_lab/tests/browser.py \
              capital_efficiency_lab/tests/capture_review.py \
              capital_efficiency_lab/tests/static_integrity.py \
              cost_gate_foundation/tests/static_integrity.py \
              cost_gate_critique/build.py \
              cost_gate_critique/tests/static_integrity.py \
              cost_gate_critique/tests/package_integrity.py \
              cost_gate_critique/tests/browser.py \
              cost_gate_critique/tests/capture_review.py
            python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('app/Breaktest_Studio.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No JavaScript block found in Breaktest_Studio.html')
          Path('/tmp/breaktest-built.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
            node --check /tmp/breaktest-built.js
            node --check validation_site/config.js
            node --check validation_site/calculator.js
            node --check validation_site/app.js
            node --check capital_efficiency_lab/engine.js
            node --check capital_efficiency_lab/app.js
            node --check capital_efficiency_lab/result_freshness.js
            node --check capital_efficiency_lab/tests/scenario_matrix.test.js
            node --check capital_efficiency_lab/tests/edge_range.test.js
            node --check capital_efficiency_lab/tests/point_range_consistency.test.js
            node --check capital_efficiency_lab/tests/optional_annual_inputs.test.js
            node --check cost_gate_foundation/engine.js
            node --check cost_gate_foundation/tests/fixtures.js
            node --check cost_gate_foundation/tests/engine.test.js
            node --check cost_gate_foundation/tests/scenario_matrix.test.js
            node --check cost_gate_foundation/tests/properties.test.js
            node --check cost_gate_critique/src/crypto-shim.js
            node --check cost_gate_critique/src/scenario.js
            node --check cost_gate_critique/src/presenter.js
            node --check cost_gate_critique/src/app.js
            node --check cost_gate_critique/tests/crypto_shim.test.js
            node --check cost_gate_critique/tests/scenario.test.js
            node --check cost_gate_critique/tests/presenter.test.js
            node --check cost_gate_critique/dist/breaktest-cost-gate-gate1/assets/engine-bundle.js
          } 2>&1 | tee javascript-syntax.log

      - name: Upload validation and review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breaktest-validation-logs
          path: |
            build.log
            numeric-tests.log
            static-integrity.log
            browser-tests.log
            review-capture.log
            javascript-syntax.log
            capital_efficiency_lab/review_artifacts/*.png
            cost_gate_critique/review_artifacts/*.png
            cost_gate_critique/dist/breaktest-cost-gate-gate1/MANIFEST.json
            cost_gate_critique/dist/breaktest-cost-gate-gate1-internal-review.zip
          if-no-files-found: warn
          retention-days: 3
